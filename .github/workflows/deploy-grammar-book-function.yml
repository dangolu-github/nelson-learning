name: Deploy protected grammar book service

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nelson-grammar-book-service
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the pinned CloudBase CLI
        run: npm install --global @cloudbase/cli@3.6.4

      - name: Authenticate to the Nelson CloudBase environment
        run: >-
          tcb login
          --cloudbase-api-key "${{ secrets.TCB_API_KEY }}"
          --env-id "${{ secrets.TCB_ENV_ID }}"
          --json

      - name: Deploy the protected HTTP function
        working-directory: functions/nelson-grammar-book-link
        run: >-
          tcb fn deploy nelson-grammar-book-link
          --env-id "${{ secrets.TCB_ENV_ID }}"
          --dir .
          --httpFn
          --path /nelson-grammar-book
          --runtime Nodejs18.15
          --deployMode zip
          --force
          --yes
          --json
